# STNE Spy vhost.
#
# This file belongs in the DATA PLATFORM repository, at
# nginx/conf.d/60-stne-https.conf — that container owns ports 80 and 443 and is
# the only thing that can serve this. See docs/adr/0003.
#
# It must be COMMITTED there, not left as a local edit on the host: a
# `git checkout` on the platform would silently remove it, which has already
# happened once on that host with Metabase's encryption key.
#
# Certificate: request it through the platform's existing certbot flow, e.g.
#   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#     -d stne.franklingreen.de
# Renewal is driven by the platform's Airflow DAG, not by cron.

# Port 80 for this host is handled centrally in 00-http-acme.conf, together with
# the platform's other domains — add `stne.franklingreen.de` to its server_name
# there rather than declaring a second port-80 block here, which would collide.

upstream stne_spy_upstream {
    server stne-spy:8000;
    keepalive 16;
}

server {
    # IPv4 only, deliberately — every other vhost on this nginx does the same.
    # A `listen [::]:443` here binds dual-stack and, being the only IPv6
    # listener, makes this block the default server for the whole address:
    # every other subdomain then gets served this certificate over IPv6.
    listen 443 ssl;
    http2 on;
    server_name stne.franklingreen.de;

    ssl_certificate     /etc/letsencrypt/live/stne.franklingreen.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stne.franklingreen.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # This host serves intelligence about other players. Keep it out of search
    # engines and out of referrer headers sent to the game.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Colony surfaces hotlink building graphics from the game's image server, so
    # img-src must allow it. Everything else stays same-origin.
    #
    # Must be one line: nginx has no backslash line-continuation, so a wrapped
    # value ends up containing literal backslashes and newlines, which HTTP/2
    # rejects as an invalid header field.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://game.stne.net data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

    client_max_body_size 8m;   # ingest batches carry raw page payloads

    location / {
        proxy_pass http://stne_spy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    location /static/ {
        proxy_pass http://stne_spy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
