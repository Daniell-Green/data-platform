version: 2

exposures:
  - name: supply_marketing_reporting
    label: Supply & Marketing Reporting
    type: dashboard
    maturity: high

    description: >
      Metabase dashboard for the Supply & Marketing department: executive KPIs,
      revenue by country and over time, product performance, customer overview,
      and a data quality view showing which source rows are filtered out of the
      reported figures and why. fct_sm_sales carries every source transaction;
      a dashboard-level filter on dq_valid, defaulting to true, decides which
      rows the headline KPI cards count.

    url: https://metabase.franklingreen.de/dashboard/3
    owner:
      name: Daniell Green
      email: hdf.green@gmail.com

    depends_on:
      - ref('fct_sm_sales')
      - ref('dim_sm_customer')
      - ref('dim_sm_product')
      - ref('dim_sm_date')
      - ref('mart_sm_data_quality')
